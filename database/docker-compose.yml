services:
  postgres:
    image: postgres:17-alpine
    container_name: veridoc-postgres
    environment:
      POSTGRES_DB: veridoc
      POSTGRES_USER: veridoc
      # Local development only. Production credentials come from the
      # environment, never from a file in version control.
      POSTGRES_PASSWORD: veridoc_local_dev
    ports:
      - "5432:5432"
    volumes:
      - veridoc-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridoc -d veridoc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  veridoc-data: