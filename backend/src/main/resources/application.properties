spring.application.name=veridoc
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Database ----
# Local development defaults. The password comes from the environment so no
# credential is committed. Tests ignore all of this: Testcontainers supplies
# its own connection details at runtime.
# Points at the shared local Docker container (etka_postgres) rather than a
# dedicated one — the standalone compose setup in database/ was abandoned when
# port 5432 turned out to be already taken. Credentials come from the
# environment in any real deployment; these defaults are local-only.
spring.datasource.url=jdbc:postgresql://localhost:5432/veridoc
spring.datasource.username=${DB_USERNAME:etka_dev}
spring.datasource.password=${DB_PASSWORD:etka_dev_password}

# Flyway owns the schema. ddl-auto=validate means Hibernate checks the mapping
# against the real tables and refuses to start on a mismatch, rather than
# silently altering them.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# ---- Hashing ----
veridoc.hash.salt=${VERIDOC_HASH_SALT:local-development-salt-change-me}