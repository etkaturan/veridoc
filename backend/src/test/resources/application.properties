# Tests run against a database in the locally running Docker container rather
# than a Testcontainers-managed one. Less isolated than a throwaway container,
# but it still exercises the real migrations, the real PostgreSQL dialect and
# the real constraints — which is the point of not using an in-memory database.
#
# Requires the container to be running. Setup is documented in database/README.
spring.datasource.url=jdbc:postgresql://localhost:5432/veridoc_test
spring.datasource.username=etka_dev
spring.datasource.password=etka_dev_password

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
logging.level.org.flywaydb=DEBUG

# Fixed salt so hashes are reproducible across test runs.
veridoc.hash.salt=test-salt-not-for-production

